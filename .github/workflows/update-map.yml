name: Update glider recovery map

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tracker.py'
      - 'config.json'
      - 'requirements.txt'
      - '.github/workflows/update-map.yml'
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: glider-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate latest map
        run: python tracker.py
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
